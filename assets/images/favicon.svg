<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E30B5C" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0A0D14"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2"/>
  <!-- Central Chip -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="#111827" stroke="url(#grad)" stroke-width="2"/>
  <!-- Core -->
  <circle cx="32" cy="32" r="6" fill="url(#grad)"/>
  <!-- Pins Top -->
  <line x1="24" y1="12" x2="24" y2="18" stroke="#00E676" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="12" x2="32" y2="18" stroke="#00E676" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="12" x2="40" y2="18" stroke="#00E676" stroke-width="2" stroke-linecap="round"/>
  <!-- Pins Bottom -->
  <line x1="24" y1="46" x2="24" y2="52" stroke="#E30B5C" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="52" stroke="#E30B5C" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="40" y2="52" stroke="#E30B5C" stroke-width="2" stroke-linecap="round"/>
  <!-- Pins Left -->
  <line x1="12" y1="24" x2="18" y2="24" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="18" y2="32" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="40" x2="18" y2="40" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <!-- Pins Right -->
  <line x1="46" y1="24" x2="52" y2="24" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="52" y2="32" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="40" x2="52" y2="40" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
</svg>
